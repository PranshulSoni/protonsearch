[package]
name = "ps-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ps_bench"
path = "src/lib.rs"

[[bin]]
name = "ps-bench"
path = "src/main.rs"

# NOTE: ps-core/ps-content/ps-ocr are added only when their v2 APIs are real.
# This keeps the benchmark harness buildable while other crates are mid-flight,
# and it makes the dependency direction obvious in review.
[features]
default = ["engine", "content", "ocr"]
# Enables the filename-index and relevance harness (requires ps-index).
# Content/OCR/realfiles tooling builds without it, so the harness stays usable
# while ps-index is being edited by its owner.
engine = ["dep:ps-index"]
# Enables the v2 content benchmark through ps-content.
content = ["dep:ps-content"]
# Enables the OCR extraction + OcrIndex retrieval baseline through ps-ocr.
# onnx: the bench measures PP-OCRv6 and Indra for real, not a fallback engine.
ocr = ["dep:ps-ocr", "ps-ocr/onnx"]

[dependencies]
ps-ipc = { path = "../ps-ipc" }
ps-index = { path = "../ps-index", optional = true }
ps-content = { path = "../ps-content", optional = true }
ps-ocr = { path = "../ps-ocr", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
] }
