function switchCard(delta){if(!s.visible||switching)return;switching=true;goCard((s.mode+delta+cards.length)%cards.length);setTimeout(()=>switching=false,350)}
function show(){s.visible=true;s.mode=0;s.detail='';render();$('#island').classList.remove('off');$('#startHint').style.opacity=0;$('#summon').textContent='Hide island';setTimeout(()=>$('#searchBox')?.focus(),190)}
function hide(){s.visible=false;$('#island').classList.add('off');$('#startHint').style.opacity=1;$('#summon').textContent='Simulate Alt + Space'}
function bind(){const input=$('#searchBox');if(input){input.oninput=e=>{s.query=e.target.value;s.selected=0;const caret=e.target.selectionStart;render();const q=$('#searchBox');q.focus();q.setSelectionRange(caret,caret)};input.onkeydown=e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const h=matches();if(h.length){s.selected=(s.selected+(e.key==='ArrowDown'?1:-1)+h.length)%h.length;render();$('#searchBox').focus()}}else if(e.key==='Enter'){const h=matches();if(h[s.selected])toast('Demo: '+h[s.selected][0])}}}
$$('[data-filter]').forEach(b=>b.onclick=()=>{s.filter=b.dataset.filter;s.selected=0;render()});$$('[data-result]').forEach(b=>b.onclick=()=>{s.selected=Number(b.dataset.result);render()});
$$('[data-media]').forEach(b=>b.onclick=()=>{let a=b.dataset.media;if(a==='play')s.playing=!s.playing;else if(a==='previous'){s.media=(s.media+music.length-1)%music.length;s.seconds=0}else if(a==='next'){s.media=(s.media+1)%music.length;s.seconds=0}else if(a==='shuffle')s.shuffle=!s.shuffle;else if(a==='repeat')s.repeat=!s.repeat;else if(a==='output')s.detail='output';render()});
if($('#seek'))$('#seek').oninput=e=>{s.seconds=Number(e.target.value);$('#timeUsed').textContent=format(s.seconds);$('#timeLeft').textContent='−'+format(music[s.media][2]-s.seconds)};
$$('[data-output]').forEach(b=>b.onclick=()=>{s.output=b.dataset.output;s.detail='';render();toast('Output: '+s.output)});
$$('[data-cliptype]').forEach(b=>b.onclick=()=>{s.clip=b.dataset.cliptype;s.clipSelected=0;render()});$$('[data-clipitem]').forEach(b=>b.onclick=()=>{s.clipSelected=Number(b.dataset.clipitem);render()});
$$('[data-agent]').forEach(b=>b.onclick=()=>{s.agentSelected=Number(b.dataset.agent);render()});$$('[data-agentaction]').forEach(b=>b.onclick=()=>{const a=b.dataset.agentaction;if(a==='spawn'){s.agents.push({name:'Review Worker '+(s.agents.length-1),task:'Reviewing current results',status:'Queued',progress:0});toast('Demo subagent created')}else if(a==='pause'){const ag=s.agents[s.agentSelected];ag.status=ag.status==='Paused'?'Running':'Paused'}else toast(s.agents[s.agentSelected].task);render()});
$$('[data-setting]').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.setting);s.settings[index][2]=!s.settings[index][2];render()});$$('[data-expand]').forEach(b=>b.onclick=e=>{e.stopPropagation();s.detail=b.dataset.expand;render()});$$('[data-detail]').forEach(b=>b.onclick=()=>{s.detail=b.dataset.detail;render()});$$('[data-connect]').forEach(b=>b.onclick=()=>{toast('Simulated connection: '+b.dataset.connect);s.detail='';render()});
if($('#bright'))$('#bright').oninput=e=>{s.brightness=Number(e.target.value);e.target.nextElementSibling.textContent=s.brightness+'%'};if($('#vol'))$('#vol').oninput=e=>{s.volume=Number(e.target.value);e.target.nextElementSibling.textContent=s.volume+'%'};
$$('[data-link]').forEach(b=>b.onclick=()=>toast('Demo: '+b.dataset.link));$$('[data-notification]').forEach(b=>b.onclick=()=>{s.notifications.splice(Number(b.dataset.notification),1);render()})}
$('#summon').onclick=()=>s.visible?hide():show();$('#nextDemo').onclick=()=>{if(!s.visible)show();else switchCard(1)};
$('#island').addEventListener('wheel',e=>{if(!s.visible||e.ctrlKey||e.target.closest('input[type="range"], .pageDots, button, .inlineNav'))return;const sc=e.target.closest('.scrollarea');if(sc){const canDown=sc.scrollTop+sc.clientHeight<sc.scrollHeight-2,canUp=sc.scrollTop>2;if((e.deltaY>0&&canDown)||(e.deltaY<0&&canUp))return}e.preventDefault();if(performance.now()-lastWheel<500)return;wheelAccum+=e.deltaY;if(Math.abs(wheelAccum)>48){lastWheel=performance.now();switchCard(wheelAccum>0?1:-1);wheelAccum=0}},{passive:false});
$('#island').addEventListener('touchstart',e=>{if(e.target.closest('input'))return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('#island').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))switchCard(dx<0?1:-1)},{passive:true});
window.addEventListener('keydown',e=>{if(e.altKey&&e.code==='Space'){e.preventDefault();s.visible?hide():show()}else if(e.key==='Escape'&&s.visible){if(s.detail){s.detail='';render()}else hide()}else if(s.visible&&e.ctrlKey&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();switchCard(e.key==='ArrowDown'?1:-1)}});
const timer=setInterval(()=>{if(!document.body.contains(root)){clearInterval(timer);return}if(s.playing){s.seconds++;const dur=music[s.media][2];if(s.seconds>=dur){s.seconds=0;s.media=(s.media+1)%music.length}if(mode()==='media'&&!s.detail&&s.visible){const seek=$('#seek');if(seek){seek.value=s.seconds;$('#timeUsed').textContent=format(s.seconds);$('#timeLeft').textContent='−'+format(dur-s.seconds)}}}},1000);
render();
})();
</script></body></html>
