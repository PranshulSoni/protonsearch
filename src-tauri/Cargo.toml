[package]
name = "protondock"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png"] }
chrono = "0.4.45"
protonsearch = { package = "ProtonSearch", path = "../protonsearch", default-features = false }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Media_Control", "Foundation", "Foundation_Collections", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System_WinRT", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Devices_Radios"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
