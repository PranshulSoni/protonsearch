name: ProtonSearch Linux Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgdk-pixbuf-2.0-dev pkg-config dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build package
        working-directory: protonsearch-linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROTONSEARCH_VERSION="$VERSION" bash packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: protonsearch-linux-deb
          path: protonsearch-linux/target/packages/*.deb

  rpm:
    name: Build Fedora package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgdk-pixbuf-2.0-dev pkg-config rpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build package
        working-directory: protonsearch-linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROTONSEARCH_VERSION="$VERSION" bash packaging/fedora/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: protonsearch-linux-rpm
          path: protonsearch-linux/target/packages/*.rpm

  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel rust pkgconf gtk4 gdk-pixbuf
          useradd --create-home builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
      - name: Build package
        working-directory: protonsearch-linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          su builder -c "cargo build --release --locked && cd packaging/arch && PROTONSEARCH_VERSION='$VERSION' makepkg --syncdeps --noconfirm --cleanbuild --clean"
          mkdir -p target/packages
          cp packaging/arch/*.pkg.tar.* target/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: protonsearch-linux-arch
          path: protonsearch-linux/target/packages/*.pkg.tar.*

  release:
    name: Publish verified Linux assets
    needs: [deb, rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
