# ProtonSearch v2 — CI
#
# Honest status at Gate 0: this workflow is the target gate, not yet a green pipeline.
# - Rust: workspace scaffold compiles only intermittently while agents edit (Gate 1 WIP);
#   cargo fmt --all -- --check currently reports diffs on the scaffold.
# - Frontend: npm run build currently has transient TS errors owned by the UI agents.
# - No secrets/service credentials are used. The manual "tauri-build" job produces an
#   UNSIGNED NSIS installer artifact and never publishes it.
# - Legacy crate protonsearch/ is excluded from the workspace and is not built here
#   (read-only reference; baseline recorded in docs/audit/GATE0_BASELINE.md).

name: CI

on:
  push:
    branches: [v2-phoenix, main]
  pull_request:
    branches: [v2-phoenix, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --no-fail-fast

  frontend:
    name: Frontend (tsc + vitest + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      # Vitest suites are landing with the UI work (e.g. src/app/hotkey.test.ts,
      # src/launcher/launcherLayout.test.ts). Failures here are real signals; do not skip.
      - name: Unit tests (vitest)
        run: npm test

      - name: Typecheck + production build
        run: npm run build

  migration:
    name: Migration contract (fixture + real API probe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate synthetic legacy fixture
        run: python tests/migration/make_legacy_fixture.py --out-dir .migration-fixture

      - name: Contract tests (calls ps_core migration via probe)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python -m unittest discover -s tests/migration -p "test_*.py" -v

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-contract-evidence
          path: tests/migration/*.json
          if-no-files-found: ignore
          retention-days: 7

  tauri-build:
    name: Tauri NSIS build (manual, unsigned)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    needs: [rust, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build NSIS bundle (unsigned)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: protonsearch-nsis-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/ProtonSearch.exe
          if-no-files-found: error
          retention-days: 7
